  <!-- SQL Text Badge -->
  <rect x="22" y="82" width="84" height="28" rx="8" fill="#0F172A" />
  <text x="64" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="2.5">SQL</text>
