    <path d="M38 46 C38 53 49.6 58 64 58 C78.4 58 90 53 90 46 V56 C90 63 78.4 68 64 68 C49.6 68 38 63 38 56 Z" fill="#0369A1"/>
    <ellipse cx="64" cy="46" rx="26" ry="10" fill="#38BDF8"/>

    <!-- Top Disc -->
