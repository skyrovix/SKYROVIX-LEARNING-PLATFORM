      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="disk_top" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="disk_body" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
  </defs>
  
  <!-- Rounded Base Badge -->
  <rect width="128" height="128" rx="28" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="4"/>
  
  <!-- Database Discs Stack (SQL Universal Icon) -->
  <g transform="translate(0, -6)">
