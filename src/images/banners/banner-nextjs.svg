<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgNext" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000" />
      <stop offset="50%" stop-color="#0F0F12" />
      <stop offset="100%" stop-color="#050508" />
    </linearGradient>
    <radialGradient id="glowNext" cx="35%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#64748B" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="shadowNext" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#FFFFFF" flood-opacity="0.25" />
    </filter>
  </defs>

  <rect width="640" height="360" fill="url(#bgNext)" />
  <rect width="640" height="360" fill="url(#glowNext)" />

  <g opacity="0.06" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="72" x2="640" y2="72" /><line x1="0" y1="144" x2="640" y2="144" />
    <line x1="0" y1="216" x2="640" y2="216" /><line x1="0" y1="288" x2="640" y2="288" />
    <line x1="128" y1="0" x2="128" y2="360" /><line x1="256" y1="0" x2="256" y2="360" />
    <line x1="384" y1="0" x2="384" y2="360" /><line x1="512" y1="0" x2="512" y2="360" />
  </g>

  <!-- Center Content: Next.js N Logo & Typography -->
  <g transform="translate(100, 95)" filter="url(#shadowNext)">
    <!-- Next.js Circular Logo -->
    <g transform="translate(15, 0)">
      <circle cx="64" cy="64" r="60" fill="#000000" stroke="#333333" stroke-width="3" />
      <path d="M44 38 L44 90 M44 38 L84 90" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" />
      <path d="M84 38 L84 66" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" />
    </g>

    <!-- Typography -->
    <text x="180" y="95" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="64" letter-spacing="-1">Next.js 15</text>
    <text x="182" y="132" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="14" letter-spacing="4">FULL-STACK APP ROUTER &amp; SSR</text>
  </g>
</svg>