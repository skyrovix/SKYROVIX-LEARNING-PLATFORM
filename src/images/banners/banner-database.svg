<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050C1A" />
      <stop offset="50%" stop-color="#091A33" />
      <stop offset="100%" stop-color="#03070E" />
    </linearGradient>
    <radialGradient id="glowDb" cx="35%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#00758F" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#336791" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#03070E" stop-opacity="0" />
    </radialGradient>
    <filter id="shadowDb" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#00758F" flood-opacity="0.4" />
    </filter>
  </defs>

  <rect width="640" height="360" fill="url(#bgDb)" />
  <rect width="640" height="360" fill="url(#glowDb)" />

  <g opacity="0.06" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="72" x2="640" y2="72" /><line x1="0" y1="144" x2="640" y2="144" />
    <line x1="0" y1="216" x2="640" y2="216" /><line x1="0" y1="288" x2="640" y2="288" />
    <line x1="128" y1="0" x2="128" y2="360" /><line x1="256" y1="0" x2="256" y2="360" />
    <line x1="384" y1="0" x2="384" y2="360" /><line x1="512" y1="0" x2="512" y2="360" />
  </g>

  <!-- Center Content: Database Cylinders & Typography -->
  <g transform="translate(100, 85)" filter="url(#shadowDb)">
    <!-- Stacked DB Cylinders -->
    <g transform="translate(10, 10)">
      <!-- Cylinder 1 (Top) -->
      <path d="M 10 30 C 10 15, 110 15, 110 30 L 110 50 C 110 65, 10 65, 10 50 Z" fill="#00758F" />
      <ellipse cx="60" cy="30" rx="50" ry="15" fill="#33A9DC" />
      <!-- Cylinder 2 (Middle) -->
      <path d="M 10 65 C 10 80, 110 80, 110 65 L 110 85 C 110 100, 10 100, 10 85 Z" fill="#005B73" />
      <ellipse cx="60" cy="65" rx="50" ry="15" fill="#00758F" />
      <!-- Cylinder 3 (Bottom) -->
      <path d="M 10 100 C 10 115, 110 115, 110 100 L 110 120 C 110 135, 10 135, 10 120 Z" fill="#004354" />
      <ellipse cx="60" cy="100" rx="50" ry="15" fill="#005B73" />
    </g>

    <!-- Typography -->
    <text x="180" y="95" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="64" letter-spacing="-1">Databases</text>
    <text x="182" y="132" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="14" letter-spacing="4">SQL, POSTGRESQL &amp; MONGODB</text>
  </g>
</svg>