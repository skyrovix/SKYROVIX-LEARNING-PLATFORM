<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCss" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040C1A" />
      <stop offset="50%" stop-color="#091A38" />
      <stop offset="100%" stop-color="#030812" />
    </linearGradient>
    <radialGradient id="glowCss" cx="35%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#264DE4" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#2965F1" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#030812" stop-opacity="0" />
    </radialGradient>
    <filter id="shadowCss" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#2965F1" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="640" height="360" fill="url(#bgCss)" />
  <rect width="640" height="360" fill="url(#glowCss)" />

  <!-- Tech Grid -->
  <g opacity="0.06" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="72" x2="640" y2="72" /><line x1="0" y1="144" x2="640" y2="144" />
    <line x1="0" y1="216" x2="640" y2="216" /><line x1="0" y1="288" x2="640" y2="288" />
    <line x1="128" y1="0" x2="128" y2="360" /><line x1="256" y1="0" x2="256" y2="360" />
    <line x1="384" y1="0" x2="384" y2="360" /><line x1="512" y1="0" x2="512" y2="360" />
  </g>

  <!-- Floating Flexbox/Grid wireframe outlines -->
  <g opacity="0.2" stroke="#2965F1" stroke-width="1.5" fill="none">
    <rect x="50" y="50" width="120" height="80" rx="6" />
    <line x1="90" y1="50" x2="90" y2="130" />
    <rect x="470" y="230" width="120" height="80" rx="6" />
    <line x1="470" y1="270" x2="590" y2="270" />
  </g>

  <!-- Center Content: CSS3 Shield Logo & Typography -->
  <g transform="translate(150, 95)" filter="url(#shadowCss)">
    <!-- Official CSS3 Shield -->
    <g transform="scale(1.35)">
      <path fill="#264DE4" d="M18.814 114.123L8.76 1.352h110.48l-10.064 112.754-45.243 12.543-45.119-12.526z"/>
      <path fill="#2965F1" d="M64.001 117.062l36.559-10.136 8.601-96.354h-45.16v106.49z"/>
      <path fill="#fff" d="M64.001 51.429h18.302l1.264-14.163H64.001V23.435h34.682l-.332 3.711-3.4 38.114h-30.95V51.429z"/>
      <path fill="#EBEBEB" d="M64.083 87.349l-.061.018-15.403-4.159-.985-11.031H33.752l1.937 21.717 28.331 7.863.063-.018v-14.39z"/>
      <path fill="#fff" d="M81.127 64.675l-1.666 18.522-15.426 4.164v14.39l28.354-7.858.208-2.337 2.406-26.881H81.127z"/>
      <path fill="#EBEBEB" d="M64.048 23.435v13.831H30.64l-.277-3.108-.63-7.012-.331-3.711h34.646zm-.047 27.996v13.831H48.792l-.277-3.108-.631-7.012-.33-3.711h16.447z"/>
    </g>

    <!-- Typography -->
    <text x="195" y="105" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="78" letter-spacing="-1">CSS3</text>
    <text x="198" y="142" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="14" letter-spacing="4">FLEXBOX, GRID &amp; MODERN UI</text>
  </g>
</svg>