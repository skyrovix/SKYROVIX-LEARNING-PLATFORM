<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPhp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B17" />
      <stop offset="50%" stop-color="#121833" />
      <stop offset="100%" stop-color="#04060D" />
    </linearGradient>
    <radialGradient id="glowPhp" cx="35%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#777BB4" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#4F5B93" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#04060D" stop-opacity="0" />
    </radialGradient>
    <filter id="shadowPhp" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#777BB4" flood-opacity="0.4" />
    </filter>
  </defs>

  <rect width="640" height="360" fill="url(#bgPhp)" />
  <rect width="640" height="360" fill="url(#glowPhp)" />

  <g opacity="0.06" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="72" x2="640" y2="72" /><line x1="0" y1="144" x2="640" y2="144" />
    <line x1="0" y1="216" x2="640" y2="216" /><line x1="0" y1="288" x2="640" y2="288" />
    <line x1="128" y1="0" x2="128" y2="360" /><line x1="256" y1="0" x2="256" y2="360" />
    <line x1="384" y1="0" x2="384" y2="360" /><line x1="512" y1="0" x2="512" y2="360" />
  </g>

  <!-- Center Content: PHP Logo & Typography -->
  <g transform="translate(110, 95)" filter="url(#shadowPhp)">
    <!-- PHP Oval -->
    <g transform="translate(10, 10)">
      <ellipse cx="65" cy="55" rx="60" ry="38" fill="#777BB4" />
      <text x="65" y="68" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="900" font-size="44" text-anchor="middle">php</text>
    </g>

    <!-- Typography -->
    <text x="180" y="95" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="74" letter-spacing="-1">PHP 8</text>
    <text x="182" y="132" fill="#A5B4FC" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="14" letter-spacing="4">MODERN BACKEND &amp; SERVER SYSTEMS</text>
  </g>
</svg>