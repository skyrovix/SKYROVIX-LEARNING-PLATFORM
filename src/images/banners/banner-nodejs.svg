<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgNode" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041208" />
      <stop offset="50%" stop-color="#0A2412" />
      <stop offset="100%" stop-color="#020A05" />
    </linearGradient>
    <radialGradient id="glowNode" cx="35%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#68A063" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#3C873A" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#020A05" stop-opacity="0" />
    </radialGradient>
    <filter id="shadowNode" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#68A063" flood-opacity="0.4" />
    </filter>
  </defs>

  <rect width="640" height="360" fill="url(#bgNode)" />
  <rect width="640" height="360" fill="url(#glowNode)" />

  <g opacity="0.06" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="72" x2="640" y2="72" /><line x1="0" y1="144" x2="640" y2="144" />
    <line x1="0" y1="216" x2="640" y2="216" /><line x1="0" y1="288" x2="640" y2="288" />
    <line x1="128" y1="0" x2="128" y2="360" /><line x1="256" y1="0" x2="256" y2="360" />
    <line x1="384" y1="0" x2="384" y2="360" /><line x1="512" y1="0" x2="512" y2="360" />
  </g>

  <!-- Floating REST API endpoints -->
  <g opacity="0.25" fill="#68A063" font-family="monospace" font-size="20">
    <text x="60" y="65">app.post('/api/v1/auth')</text>
    <text x="420" y="315">HTTP 200 OK • Express</text>
  </g>

  <!-- Center Content: Node Hexagon Logo & Typography -->
  <g transform="translate(100, 95)" filter="url(#shadowNode)">
    <!-- Node.js Hexagon Logo -->
    <g transform="translate(10, 5) scale(1.3)">
      <polygon points="50,5 95,30 95,80 50,105 5,80 5,30" fill="#3C873A" stroke="#68A063" stroke-width="2" />
      <text x="50" y="68" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="900" font-size="34" text-anchor="middle">JS</text>
    </g>

    <!-- Typography -->
    <text x="180" y="95" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="64" letter-spacing="-1">Node.js</text>
    <text x="182" y="132" fill="#68A063" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="14" letter-spacing="4">EXPRESS &amp; BACKEND APIS</text>
  </g>
</svg>