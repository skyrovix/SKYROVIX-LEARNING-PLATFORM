<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgHtml" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0703" />
      <stop offset="50%" stop-color="#1F0E07" />
      <stop offset="100%" stop-color="#080301" />
    </linearGradient>
    <radialGradient id="glowHtml" cx="35%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#E44D26" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#F16529" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#080301" stop-opacity="0" />
    </radialGradient>
    <filter id="shadowHtml" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#E44D26" flood-opacity="0.4" />
    </filter>
  </defs>

  <rect width="640" height="360" fill="url(#bgHtml)" />
  <rect width="640" height="360" fill="url(#glowHtml)" />

  <!-- Tech Grid -->
  <g opacity="0.06" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="72" x2="640" y2="72" /><line x1="0" y1="144" x2="640" y2="144" />
    <line x1="0" y1="216" x2="640" y2="216" /><line x1="0" y1="288" x2="640" y2="288" />
    <line x1="128" y1="0" x2="128" y2="360" /><line x1="256" y1="0" x2="256" y2="360" />
    <line x1="384" y1="0" x2="384" y2="360" /><line x1="512" y1="0" x2="512" y2="360" />
  </g>

  <!-- Left: Floating Tag Badge -->
  <g opacity="0.25" stroke="#E44D26" stroke-width="2" fill="none">
    <text x="70" y="80" font-family="monospace" font-size="28" font-weight="bold">&lt;!DOCTYPE html&gt;</text>
    <text x="70" y="300" font-family="monospace" font-size="28" font-weight="bold">&lt;/html&gt;</text>
  </g>

  <!-- Center Content: HTML5 Shield Logo & Typography -->
  <g transform="translate(140, 95)" filter="url(#shadowHtml)">
    <!-- Official HTML5 Shield -->
    <g transform="scale(1.35)">
      <path fill="#E44D26" d="M19.037 113.876L9.032 1.661h109.936l-10.016 112.198-45.019 12.48z"/>
      <path fill="#F16529" d="M64 116.8l36.378-10.086 8.559-95.878H64z"/>
      <path fill="#EBEBEB" d="M64 52.455H45.788L44.53 38.361H64V24.599H29.489l.33 3.692 3.382 37.927H64zm0 35.743l-.061.017-15.327-4.14-.979-10.975H33.816l1.928 21.609 28.193 7.826.063-.017z"/>
      <path fill="#fff" d="M63.952 52.455v13.763h16.947l-1.597 17.849-15.35 4.143v14.319l28.215-7.82.207-2.325 3.234-36.233.335-3.696h-3.708zm0-27.856v13.762h33.244l.276-3.092.628-6.978.329-3.692z"/>
    </g>

    <!-- Typography -->
    <text x="195" y="105" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="78" letter-spacing="-1">HTML5</text>
    <text x="198" y="142" fill="#F16529" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="14" letter-spacing="4">SEMANTIC WEB ARCHITECTURE</text>
  </g>
</svg>