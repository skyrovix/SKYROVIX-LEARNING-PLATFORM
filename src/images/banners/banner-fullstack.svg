<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B081E" />
      <stop offset="50%" stop-color="#140E35" />
      <stop offset="100%" stop-color="#080516" />
    </linearGradient>

    <!-- Glowing Purple Ambient -->
    <radialGradient id="purpleGlow" cx="20%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#9333EA" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#6B21A8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0B081E" stop-opacity="0" />
    </radialGradient>

    <!-- Laptop Screen Glow -->
    <radialGradient id="screenGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1E1B4B" stop-opacity="0.8" />
    </radialGradient>

    <!-- Code Glow -->
    <linearGradient id="codeBadgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="640" height="360" fill="url(#bgGrad)" />
  <rect width="640" height="360" fill="url(#purpleGlow)" />

  <!-- Subtle Cyber Grid -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="60" x2="640" y2="60" />
    <line x1="0" y1="120" x2="640" y2="120" />
    <line x1="0" y1="180" x2="640" y2="180" />
    <line x1="0" y1="240" x2="640" y2="240" />
    <line x1="0" y1="300" x2="640" y2="300" />
    <line x1="80" y1="0" x2="80" y2="360" />
    <line x1="160" y1="0" x2="160" y2="360" />
    <line x1="240" y1="0" x2="240" y2="360" />
    <line x1="320" y1="0" x2="320" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="480" y1="0" x2="480" y2="360" />
    <line x1="560" y1="0" x2="560" y2="360" />
  </g>

  <!-- LEFT: Glowing Neon Code Symbol < / > -->
  <g transform="translate(60, 100)" filter="url(#neonGlow)">
    <rect x="-10" y="-10" width="100" height="100" rx="24" fill="#6B21A8" fill-opacity="0.3" stroke="#A855F7" stroke-width="2.5" />
    <path d="M22 40 L5 50 L22 60" fill="none" stroke="#E9D5FF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="36" y1="68" x2="44" y2="32" stroke="#E9D5FF" stroke-width="5" stroke-linecap="round" />
    <path d="M58 40 L75 50 L58 60" fill="none" stroke="#E9D5FF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- CENTER: Modern Tech Laptop With Code -->
  <g transform="translate(200, 75)">
    <!-- Laptop Base Shadow -->
    <ellipse cx="130" cy="235" rx="150" ry="14" fill="#000000" fill-opacity="0.6" filter="blur(6px)" />
    
    <!-- Laptop Screen Lid -->
    <rect x="20" y="20" width="220" height="150" rx="10" fill="#0F172A" stroke="#334155" stroke-width="3" />
    <!-- Screen Inner Display -->
    <rect x="28" y="28" width="204" height="134" rx="6" fill="#090D16" />
    
    <!-- Screen Code Lines -->
    <g opacity="0.9">
      <!-- Tab bar -->
      <rect x="28" y="28" width="204" height="14" fill="#1E293B" />
      <circle cx="36" cy="35" r="2.5" fill="#EF4444" />
      <circle cx="44" cy="35" r="2.5" fill="#F59E0B" />
      <circle cx="52" cy="35" r="2.5" fill="#10B981" />
      <rect x="62" y="32" width="45" height="6" rx="2" fill="#334155" />
      
      <!-- Code lines -->
      <rect x="36" y="50" width="45" height="5" rx="2" fill="#C084FC" />
      <rect x="85" y="50" width="55" height="5" rx="2" fill="#60A5FA" />
      <rect x="46" y="62" width="65" height="4" rx="2" fill="#34D399" />
      <rect x="46" y="72" width="90" height="4" rx="2" fill="#F472B6" />
      <rect x="56" y="82" width="110" height="4" rx="2" fill="#93C5FD" />
      <rect x="56" y="92" width="75" height="4" rx="2" fill="#FBBF24" />
      <rect x="46" y="104" width="40" height="4" rx="2" fill="#A78BFA" />
      <rect x="36" y="116" width="30" height="4" rx="2" fill="#C084FC" />
      
      <!-- Mini terminal below -->
      <rect x="36" y="130" width="188" height="24" rx="3" fill="#020617" stroke="#1E293B" stroke-width="1" />
      <text x="44" y="145" fill="#22C55E" font-family="monospace" font-size="8" font-weight="bold">✓ Build ready in 420ms</text>
    </g>

    <!-- Laptop Keyboard Deck & Base -->
    <path d="M-5 170 L265 170 L250 188 L10 188 Z" fill="#1E293B" stroke="#475569" stroke-width="1.5" />
    <path d="M85 172 L175 172 L170 178 L90 178 Z" fill="#0F172A" />
    <!-- Front Lip Notch -->
    <rect x="115" y="186" width="30" height="3" rx="1.5" fill="#64748B" />
  </g>

  <!-- RIGHT: Tech Stack Badges (React, JS, MySQL / DB) -->
  <g transform="translate(500, 90)">
    <!-- React Atom Icon Badge -->
    <g transform="translate(0, 0)">
      <circle cx="28" cy="28" r="26" fill="#0C1B2B" stroke="#00D8FE" stroke-width="2" />
      <!-- React Atom orbits -->
      <ellipse cx="28" cy="28" rx="18" ry="7" fill="none" stroke="#00D8FE" stroke-width="1.5" />
      <ellipse cx="28" cy="28" rx="18" ry="7" fill="none" stroke="#00D8FE" stroke-width="1.5" transform="rotate(60 28 28)" />
      <ellipse cx="28" cy="28" rx="18" ry="7" fill="none" stroke="#00D8FE" stroke-width="1.5" transform="rotate(120 28 28)" />
      <circle cx="28" cy="28" r="3.5" fill="#00D8FE" />
    </g>

    <!-- JavaScript Badge -->
    <g transform="translate(4, 70)">
      <rect x="0" y="0" width="48" height="48" rx="10" fill="#F7DF1E" />
      <path d="M16 38 C18 41 21 42 24 42 C28 42 30 40 30 36 L30 22 L24 22 L24 35 C24 37 23 38 21 38 C19 38 18 37 17 35 Z" fill="#000000" />
      <path d="M34 38 C36 40.5 39 42 42.5 42 C46.5 42 49 40 49 36.5 C49 33.5 47 32 43 30.5 C40 29.5 39 28.5 39 27 C39 25.5 40.5 24.5 42.5 24.5 C44.5 24.5 46 25.5 47 27.5 L51 25 C49.5 22 46.5 21 42.5 21 C38.5 21 35 23.5 35 27 C35 30 37 31.5 41 33 C44 34.2 45 35.2 45 36.8 C45 38.5 43.5 39.2 41.5 39.2 C39 39.2 37 37.8 35.8 35.5 Z" fill="#000000" transform="translate(-6, 0)" />
    </g>

    <!-- MySQL / Database Badge -->
    <g transform="translate(0, 138)">
      <rect x="0" y="0" width="56" height="34" rx="8" fill="#0B2036" stroke="#00758F" stroke-width="1.5" />
      <text x="28" y="22" fill="#00758F" font-family="system-ui, sans-serif" font-weight="900" font-size="12" text-anchor="middle">MySQL</text>
    </g>
  </g>
</svg>

