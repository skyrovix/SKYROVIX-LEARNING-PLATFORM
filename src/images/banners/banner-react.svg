<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgReact" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040D1A" />
      <stop offset="50%" stop-color="#071933" />
      <stop offset="100%" stop-color="#030812" />
    </linearGradient>
    <radialGradient id="glowReact" cx="35%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#00D8FE" stop-opacity="0.38" />
      <stop offset="60%" stop-color="#0284C7" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#030812" stop-opacity="0" />
    </radialGradient>
    <filter id="shadowReact" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#00D8FE" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="640" height="360" fill="url(#bgReact)" />
  <rect width="640" height="360" fill="url(#glowReact)" />

  <g opacity="0.06" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="72" x2="640" y2="72" /><line x1="0" y1="144" x2="640" y2="144" />
    <line x1="0" y1="216" x2="640" y2="216" /><line x1="0" y1="288" x2="640" y2="288" />
    <line x1="128" y1="0" x2="128" y2="360" /><line x1="256" y1="0" x2="256" y2="360" />
    <line x1="384" y1="0" x2="384" y2="360" /><line x1="512" y1="0" x2="512" y2="360" />
  </g>

  <!-- Floating JSX tags -->
  <g opacity="0.25" fill="#00D8FE" font-family="monospace" font-size="22">
    <text x="60" y="65">&lt;App /&gt;</text>
    <text x="440" y="315">useState(true)</text>
  </g>

  <!-- Center Content: React Atom Logo & Typography -->
  <g transform="translate(110, 90)" filter="url(#shadowReact)">
    <!-- React Atom Logo -->
    <g transform="translate(70, 70) scale(2.2)">
      <ellipse cx="0" cy="0" rx="26" ry="10" fill="none" stroke="#00D8FE" stroke-width="2.5" />
      <ellipse cx="0" cy="0" rx="26" ry="10" fill="none" stroke="#00D8FE" stroke-width="2.5" transform="rotate(60)" />
      <ellipse cx="0" cy="0" rx="26" ry="10" fill="none" stroke="#00D8FE" stroke-width="2.5" transform="rotate(120)" />
      <circle cx="0" cy="0" r="5" fill="#00D8FE" />
    </g>

    <!-- Typography -->
    <text x="195" y="100" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="74" letter-spacing="-1">React 19</text>
    <text x="198" y="138" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="14" letter-spacing="4">MODERN COMPONENT SYSTEMS</text>
  </g>
</svg>