<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117" />
      <stop offset="50%" stop-color="#161B22" />
      <stop offset="100%" stop-color="#090D12" />
    </linearGradient>
    <radialGradient id="glowGit" cx="35%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#F05032" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#EA4 AAA" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#090D12" stop-opacity="0" />
    </radialGradient>
    <filter id="shadowGit" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#F05032" flood-opacity="0.4" />
    </filter>
  </defs>

  <rect width="640" height="360" fill="url(#bgGit)" />
  <rect width="640" height="360" fill="url(#glowGit)" />

  <!-- Branching Node Constellation -->
  <g opacity="0.3" stroke="#F05032" stroke-width="2.5" fill="#F05032">
    <line x1="40" y1="180" x2="140" y2="180" />
    <path d="M140 180 Q180 180 200 120 L270 120" fill="none" />
    <line x1="140" y1="180" x2="300" y2="180" />
    <circle cx="140" cy="180" r="5" fill="#FFFFFF" />
    <circle cx="200" cy="120" r="5" fill="#FFFFFF" />
    <circle cx="270" cy="120" r="5" fill="#F05032" />
    <circle cx="300" cy="180" r="5" fill="#FFFFFF" />
  </g>

  <!-- Center Content: Git Logo & Typography -->
  <g transform="translate(130, 95)" filter="url(#shadowGit)">
    <!-- Git Diamond Logo -->
    <g transform="translate(15, 5)">
      <rect x="18" y="18" width="100" height="100" rx="16" transform="rotate(45 68 68)" fill="#F05032" />
      <!-- Branch lines inside diamond -->
      <g stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" fill="none">
        <line x1="38" y1="98" x2="98" y2="38" />
        <path d="M68 68 C80 68 88 56 88 44" />
      </g>
      <circle cx="38" cy="98" r="8" fill="#FFFFFF" />
      <circle cx="98" cy="38" r="8" fill="#FFFFFF" />
      <circle cx="88" cy="44" r="8" fill="#FFFFFF" />
    </g>

    <!-- Typography -->
    <text x="180" y="95" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="64" letter-spacing="-1">Git &amp; GitHub</text>
    <text x="182" y="132" fill="#F05032" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="14" letter-spacing="4">VERSION CONTROL &amp; CI/CD</text>
  </g>
</svg>