<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgJava" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140705" />
      <stop offset="50%" stop-color="#240E0A" />
      <stop offset="100%" stop-color="#0D0403" />
    </linearGradient>
    <radialGradient id="glowJava" cx="35%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#EA2D2E" stop-opacity="0.38" />
      <stop offset="60%" stop-color="#5382A1" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0D0403" stop-opacity="0" />
    </radialGradient>
    <filter id="shadowJava" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#EA2D2E" flood-opacity="0.4" />
    </filter>
  </defs>

  <rect width="640" height="360" fill="url(#bgJava)" />
  <rect width="640" height="360" fill="url(#glowJava)" />

  <g opacity="0.06" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="72" x2="640" y2="72" /><line x1="0" y1="144" x2="640" y2="144" />
    <line x1="0" y1="216" x2="640" y2="216" /><line x1="0" y1="288" x2="640" y2="288" />
    <line x1="128" y1="0" x2="128" y2="360" /><line x1="256" y1="0" x2="256" y2="360" />
    <line x1="384" y1="0" x2="384" y2="360" /><line x1="512" y1="0" x2="512" y2="360" />
  </g>

  <!-- Center Content: Java Steaming Cup Logo & Typography -->
  <g transform="translate(130, 95)" filter="url(#shadowJava)">
    <!-- Steaming Coffee Cup -->
    <g transform="translate(15, 0)">
      <!-- Steam -->
      <path d="M50 15 Q65 30 50 45" stroke="#5382A1" stroke-width="5" fill="none" stroke-linecap="round" />
      <path d="M68 5 Q83 25 68 45" stroke="#EA2D2E" stroke-width="5" fill="none" stroke-linecap="round" />
      <!-- Cup Base -->
      <ellipse cx="60" cy="115" rx="50" ry="12" fill="#5382A1" />
      <path d="M20 75 Q20 110 60 110 Q100 110 100 75 Z" fill="#EA2D2E" />
      <path d="M100 80 Q118 80 118 92 Q118 104 100 104" stroke="#5382A1" stroke-width="5" fill="none" />
    </g>

    <!-- Typography -->
    <text x="180" y="95" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="74" letter-spacing="-1">Java</text>
    <text x="182" y="132" fill="#EA2D2E" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="14" letter-spacing="4">ENTERPRISE OOP ARCHITECTURE</text>
  </g>
</svg>